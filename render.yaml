services:
  - type: web
    name: GVC_backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@gvcagro.lk
      - key: FRONTEND_URL
        sync: false

  - type: cron
    name: GVC_nightly_cron
    env: node
    region: singapore
    plan: free
    schedule: "0 1 * * *" # Runs daily at 1:00 AM
    buildCommand: "echo 'No build needed for cron curl'"
    startCommand: "curl -X POST https://gvc-backend.onrender.com/api/cron/nightly -H \"Authorization: Bearer $CRON_SECRET\""
    envVars:
      - key: CRON_SECRET
        sync: false
